name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.1
      - name: spec
        run: crystal spec
      - name: build
        run: crystal build --release grimoire.cr -o grimoire-bin
      - name: selftest
        run: ./grimoire-bin selftest
      - name: forge + triage smoke
        run: |
          ./grimoire-bin forge macro ./fx
          ./grimoire-bin ./fx/invoice_summary.docm
          ./grimoire-bin forge template ./fx
          ./grimoire-bin ./fx/policy_update.docx || test $? -eq 3
          ./grimoire-bin forge clean ./fx
          ./grimoire-bin ./fx/invoice_summary.docx

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            asset: grimoire-linux-x64
          - os: macos-14
            asset: grimoire-macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.1
      - name: build release
        run: crystal build --release grimoire.cr -o ${{ matrix.asset }}
      - name: selftest the release binary
        run: ./${{ matrix.asset }} selftest
      - name: upload to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY" || \
            gh release create "$GITHUB_REF_NAME" "${{ matrix.asset }}" --title "$GITHUB_REF_NAME" --notes "grimoire $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
